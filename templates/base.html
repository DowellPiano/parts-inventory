<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parts Inventory{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong><a href="{{ url_for('dashboard') }}">Parts Inventory</a></strong></li>
        </ul>
        <ul>
            <li><a href="{{ url_for('parts_list') }}">Parts</a></li>
            <li><a href="{{ url_for('bins_list') }}">Bins</a></li>
            <li><a href="{{ url_for('reorder') }}">Reorder</a></li>
            <li><a href="{{ url_for('intake') }}">PO Intake</a></li>
            <li><a href="{{ url_for('optimize') }}">Optimize</a></li>
        </ul>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <article class="flash flash-{{ category }}">{{ message }}</article>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
